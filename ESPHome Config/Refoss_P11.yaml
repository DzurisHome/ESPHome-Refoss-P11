#ESPHome Core
esphome:
  name: refoss-p11
  area: Bedroom #Change to your Room
  name_add_mac_suffix: true
  project: 
    name: "Dzuriš Home.Refoss P11"
    version: "Dzuriš Home ESPHome"
  #System
  on_boot:
    priority: 798
    then:
      - if:
          condition:
            switch.is_on: relay
          then:
            - switch.turn_on: led
          else:
            - switch.turn_off: led

esp8266:
  board: esp01_1m

#Logger
logger:
  baud_rate: 0

#Safe Mode
safe_mode:
  boot_is_good_after: 1min
  reboot_timeout: 5min

#WiFi
wifi:
  ssid: #SSID or !secret wifi_ssid
  password: #Password or !secret wifi_password
  manual_ip: #If you don't want set manual IPs, Delete (manual_ip and below that)
    static_ip: #Refoss P11 Device IP
    gateway: #Router IP
    subnet: #Router Subnet IP
  ap:
    ssid: "Refoss P11 Dzuriš Home AP"
    password: #Acess Point password or !secret ap_password

#WiFi Hotspot
captive_portal:

#OTA
ota:
  - platform: esphome
    password: #Password or !secret ota_password

#SNTP Time
time: #If you want to change the time on Home Assistant change it or stay on SNTP but you need change timezone and SNTP server for your Country
  - platform: sntp
    timezone: Europe/Bratislava
    servers:
     - 1.sk.pool.ntp.org
     - 0.europe.pool.ntp.org
     - 1.europe.pool.ntp.org

#Web Server
web_server: #If you don't want Web Server, Delete (web_server and below that) 
  port: 80
  auth:
    type: digest
    username: #Username or !secret web_server_username
    password: #Password or !secret web_server_password
  include_internal: false
  log: true
  version: 3

#ESPHome API
api: #If you don't want ESPHome API, Delete (api and below that)
  encryption:
    key: #Key or !secret api_encryption_key

#MQTT
mqtt: #If you don't have or want MQTT Broker, Delete (mqtt and below that)
  broker: #Broker or !secret mqtt_broker_ip_address
  username: #Username or !secret mqtt_broker_username
  password: #Password or !secret mqtt_broker_password
  client_id: "Refoss P11"
  topic_prefix: "Refoss P11"
  discovery: false #If you change to true Home Assistant don't discovery device only from MQTT Integration

#Device Required
uart:
  rx_pin: GPIO03
  baud_rate: 4800
  parity: EVEN

#Device
switch:
  - platform: gpio
    pin: GPIO13
    restore_mode: ALWAYS_OFF
    id: relay
    name: "Refoss P11"
    icon: mdi:power-socket-fr
    on_turn_on:
      - switch.turn_on: led
    on_turn_off:
      - switch.turn_off: led

  - platform: gpio
    pin:
      number: GPIO12
      inverted: true
    id: led
    name: "Refoss P11 Switch LED"
    internal: true

light:
  - platform: status_led
    pin:
      number: GPIO4
      inverted: true
    name: "Refoss P11 Status LED"
    internal: true
    entity_category: "diagnostic"

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO05
      inverted: true
    name: "Refoss P11 Power Button"
    entity_category: "diagnostic"
    on_press:
      then:
        - switch.toggle: relay
    on_click:
      min_length: 5s
      max_length: 10s
      then:
        - button.press: restart_device

sensor:
  - platform: cse7766
    voltage:
      filters:
        - multiply: 1.8955 #Calibrate for your device with a reference meter
        - throttle_average: 30s #Update interval, you can change it
      name: "Refoss P11 Voltage"
      icon: mdi:sine-wave
      unit_of_measurement: "V"
      device_class: "voltage"
      state_class: "measurement"
      accuracy_decimals: 1
    current:
      filters:
        - multiply: 0.9723 #Calibrate for your device with a reference meter
        - lambda: |-
            if (fabs(x) < 1e-10) return 0.0;
            return x;
        - throttle_average: 10s #Update interval, you can change it
      name: "Refoss P11 Current"
      icon: mdi:current-ac
      unit_of_measurement: "A"
      device_class: "current"
      state_class: "measurement"
      accuracy_decimals: 2
      #Overload Protection
      on_value: #If you don't want Overload Protection, Delete (on_value and below that) and select overload_protection
        then:
          - if:
              condition:
                lambda: |-
                  if (id(overload_protection).current_option() == "5 A" && x > 5.0) return true;
                  if (id(overload_protection).current_option() == "10 A" && x > 10.0) return true;
                  if (id(overload_protection).current_option() == "13 A" && x > 13.0) return true;
                  if (id(overload_protection).current_option() == "15 A" && x > 15.0) return true;
                  return false;
              then:
                - switch.turn_off: relay
                - logger.log: "Overload Protection | Socket OFF"
    power:
      filters:
        - multiply: 1.8430 #Calibrate for your device with a reference meter
        - lambda: |-
            if (fabs(x) < 0.01) return 0.0;
            return x;
        - throttle_average: 10s #Update interval, you can change it
      name: "Refoss P11 Power"
      icon: mdi:flash-outline
      unit_of_measurement: "W"
      device_class: "power"
      state_class: "measurement"
      accuracy_decimals: 2
      #Overload Fuse
      on_value_range: #If you don't want Overload Fuse, Delete (on_value_range and below that)
        - above: 3400
          then:
            - switch.turn_off: relay
            - logger.log: "Overload Fuse | Socket OFF"

#Device Required
  - platform: adc
    pin: GPIO17
    samples: 1
    sampling_mode: avg
    update_interval: 10s
    id: ntc_adc
    filters:
      - sliding_window_moving_average:
          window_size: 6
          send_every: 6

  - platform: resistance
    sensor: ntc_adc
    configuration: UPSTREAM
    resistor: 4kOhm
    reference_voltage: 3.3V
    id: ntc_resistance
    name: "Refoss P11 Socket NTC Resistance"
    icon: mdi:omega
    unit_of_measurement: "Ω"
    state_class: "measurement"
    entity_category: diagnostic
    internal: true

#Diagnostic
  - platform: ntc
    sensor: ntc_resistance
    calibration:
      b_constant: 4250
      reference_temperature: 25°C
      reference_resistance: 80kOhm
    name: "Refoss P11 Internal Temperature"
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    entity_category: "diagnostic"
    #Overheat Protection
    on_value: #If you don't want Overheat Protection, Delete (on_value and below that) and select overheat_protection
      then:
        - if:
            condition:
              lambda: |-
                if (id(overheat_protection).current_option() == "30 °C" && x > 30.0) return true;
                if (id(overheat_protection).current_option() == "40 °C" && x > 40.0) return true;
                if (id(overheat_protection).current_option() == "50 °C" && x > 50.0) return true;
                if (id(overheat_protection).current_option() == "60 °C" && x > 60.0) return true;
                if (id(overheat_protection).current_option() == "70 °C" && x > 70.0) return true;
                return false;
            then:
              - switch.turn_off: relay
              - logger.log: "Overheat Protection | Socket OFF"

  - platform: wifi_signal
    update_interval: 1min
    name: "Refoss P11 RSSI"
    unit_of_measurement: "dBm"
    device_class: "signal_strength"
    state_class: "measurement"
    entity_category: "diagnostic"

  - platform: uptime
    type: timestamp
    name: "Refoss P11 Uptime"
    icon: mdi:clock-time-four-outline
    device_class: "timestamp"
    entity_category: "diagnostic"

#Configuration
select:
  - platform: template
    restore_value: true
    optimistic: true
    options:
      - "Off"
      - "5 A"
      - "10 A"
      - "13 A"
      - "15 A"
    initial_option: "10 A"
    update_interval: 1s
    id: overload_protection
    name: "Refoss P11 Overload Protection"
    icon: mdi:flash-alert-outline
    entity_category: "config"

  - platform: template
    restore_value: true
    optimistic: true
    options:
      - "Off"
      - "30 °C"
      - "40 °C"
      - "50 °C"
      - "60 °C"
      - "70 °C"
    initial_option: "60 °C"
    update_interval: 1s
    id: overheat_protection
    name: "Refoss P11 Overheat Protection"
    icon: mdi:thermometer-alert
    entity_category: "config"

button:
  - platform: restart
    id: restart_device
    name: "Refoss P11 Restart"
